name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Mỗi khi bạn push lên nhánh main, hành động này sẽ chạy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # Sửa thành ./build hoặc ./dist nếu bạn dùng React/Vite/Vue